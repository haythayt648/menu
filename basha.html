<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basha Panel | لوحة التحكم الكاملة</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #f0f2f5; font-family: sans-serif; padding: 15px; margin: 0; }
        .admin-header { background: #222; color: white; padding: 20px; text-align: center; border-bottom: 5px solid #ff6b00; margin-bottom: 20px; }
        .order-row { background: white; margin-bottom: 15px; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.85em; color: white; font-weight: bold; display: inline-block; }
        .waiting { background: #dc3545; }
        .delivered { background: #28a745; }
        .actions { margin-top: 15px; display: flex; gap: 10px; }
        .btn { border: none; padding: 10px; border-radius: 8px; color: white; cursor: pointer; flex: 1; font-weight: bold; }
        .btn-success { background: #28a745; }
        .btn-danger { background: #d9534f; }
        .btn-delete { background: #333; }
        .info { margin-bottom: 10px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="admin-header">
        <h1>لوحة تحكم الباشا الكاملة 👑</h1>
        <p>تحكم في الطلبات والمناديب</p>
    </div>
    
    <div id="admin-list">جاري تحميل البيانات...</div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAtU8ALJ5N3VBxbeGPpNk-790fA4MBP8nk",
            databaseURL: "https://nabda-coffee-default-rtdb.firebaseio.com",
            projectId: "nabda-coffee"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('mishwar_orders').on('value', snapshot => {
            const list = document.getElementById('admin-list');
            list.innerHTML = '';
            
            snapshot.forEach(child => {
                const order = child.val();
                const key = child.key;
                const statusText = order.status === 'waiting' ? 'جاري الانتظار' : 'تم التوصيل ✔️';
                const statusClass = order.status === 'waiting' ? 'waiting' : 'delivered';

                list.innerHTML += `
                    <div class="order-row">
                        <div class="info">
                            <b>الزبون:</b> ${order.customer} | ${order.phone}<br>
                            <b>المطعم:</b> ${order.restaurant}<br>
                            <b>الطلب:</b> ${order.item}<br>
                            <span class="badge ${statusClass}">${statusText}</span>
                        </div>
                        <div class="actions">
                            <button class="btn btn-success" onclick="updateOrder('${key}', 'delivered')">تم التوصيل</button>
                            <button class="btn btn-delete" onclick="deleteOrder('${key}')">حذف (Sil)</button>
                        </div>
                    </div>`;
            });
        });

        // Durumu güncelle (Teslim edildi yap)
        function updateOrder(key, newStatus) {
            db.ref('mishwar_orders/' + key).update({status: newStatus});
        }

        // Siparişi tamamen sil
        function deleteOrder(key) {
            if(confirm('Basha, bu siparişi silmek istediğine emin misin?')) {
                db.ref('mishwar_orders/' + key).remove();
            }
        }
    </script>
</body>
</html>
