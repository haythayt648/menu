<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basha Control | التحكم</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; padding: 10px; }
        .order-card { background: #2a2a2a; border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 1px solid #444; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .my-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-weight: bold; font-size: 1.1em; cursor: pointer; color: white; text-align: center; }
        .btn-done { background: #28a745; } /* Yeşil - Tamam */
        .btn-del { background: #dc3545; }  /* Kırmızı - Sil */
        .status-label { font-size: 0.9em; padding: 5px 10px; border-radius: 5px; background: #ff6b00; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">لوحة تحكم الباشا 👑</h2>
    <div id="order-list">Siparişler yükleniyor...</div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAtU8ALJ5N3VBxbeGPpNk-790fA4MBP8nk",
            databaseURL: "https://nabda-coffee-default-rtdb.firebaseio.com",
            projectId: "nabda-coffee"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('mishwar_orders').on('value', (snapshot) => {
            const list = document.getElementById('order-list');
            list.innerHTML = '';
            snapshot.forEach((child) => {
                const order = child.val();
                const key = child.key;
                list.innerHTML += `
                    <div class="order-card">
                        <div><b>الزبون:</b> ${order.customer}</div>
                        <div><b>الطلب:</b> ${order.item}</div>
                        <div style="margin-top:10px;"><span class="status-label">${order.status === 'waiting' ? 'انتظار' : 'تم توصيله'}</span></div>
                        
                        <div class="btn-group">
                            <button class="my-btn btn-done" onclick="finishOrder('${key}')">تم (Bitti)</button>
                            <button class="my-btn btn-del" onclick="removeOrder('${key}')">حذف (Sil)</button>
                        </div>
                    </div>`;
            });
        });

        function finishOrder(id) {
            db.ref('mishwar_orders/' + id).update({ status: 'delivered' });
        }

        function removeOrder(id) {
            if(confirm('Emin misin Basha?')) {
                db.ref('mishwar_orders/' + id).remove();
            }
        }
    </script>
</body>
</html>
