<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منيو نبضة كوفي</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: #121212; 
            background-image: url('https://nabda-coffee.github.io/images/nabda-coffee-main-image_20.jpg'); 
            background-size: cover; 
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #fff; 
            font-family: sans-serif; 
            margin: 0; 
            padding-bottom: 160px; 
        }
        .header { background: rgba(20, 20, 20, 0.95); padding: 10px 15px; border-bottom: 3px solid #d35400; text-align: center; position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(10px); }
        .logo-text { font-size: 1.4em; font-weight: bold; color: #d35400; margin-bottom: 8px; }
        .selection-container { display: flex; gap: 8px; justify-content: center; max-width: 500px; margin: 0 auto; }
        .selection-box { background: rgba(211, 84, 0, 0.2); border: 1px solid #d35400; padding: 6px; border-radius: 12px; flex: 1; }
        .box-label { font-size: 0.7em; color: #aaa; display: block; margin-bottom: 2px; }
        .admin-btn { background: #f1c40f; color: #000; border: none; padding: 8px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; }
        .admin-btn.active { background: #27ae60; color: #fff; }
        .masa-select { background: #fff; color: #000; border: none; padding: 8px; border-radius: 8px; font-weight: bold; width: 100%; text-align: center; }
        
        .category-title { background: rgba(44, 62, 80, 0.9); padding: 12px 15px; margin-top: 25px; font-weight: bold; color: #f1c40f; border-right: 6px solid #d35400; font-size: 1.1em; }
        .item-card { background: rgba(30, 30, 30, 0.75); border: 1px solid rgba(255,255,255,0.05); border-radius: 18px; margin: 10px; padding: 15px; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(5px); }
        .item-info { flex: 1; text-align: right; margin-right: 15px; }
        .item-name { font-size: 1.05em; font-weight: bold; display: block; margin-bottom: 4px; }
        .item-price { color: #f1c40f; font-weight: 800; font-size: 0.95em; }
        
        .qty-controls { display: flex; align-items: center; background: rgba(0,0,0,0.3); border-radius: 30px; padding: 4px; border: 1px solid rgba(255,255,255,0.1); }
        .qty-btn { background: #d35400; color: white; border: none; width: 35px; height: 35px; border-radius: 50%; font-size: 20px; cursor: pointer; }
        .qty-num { margin: 0 12px; font-weight: bold; font-size: 1.2em; min-width: 20px; text-align: center; }

        .cart-bar { position: fixed; bottom: 0; width: 100%; background: rgba(20, 20, 20, 0.98); border-top: 3px solid #27ae60; padding: 15px; display: none; z-index: 2000; }
        .total-price { text-align: center; margin-bottom: 10px; font-size: 1.4em; color: #f1c40f; font-weight: bold; }
        .order-btn { background: #27ae60; color: white; border: none; padding: 15px; border-radius: 12px; font-size: 1.2em; font-weight: bold; width: 100%; cursor: pointer; }
        #msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #27ae60; color: white; padding: 25px; border-radius: 20px; display: none; z-index: 3000; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="logo-text">نبضة كوفي ☕</h1>
        <div class="selection-container">
            <div class="selection-box"><span class="box-label">الإدارة</span><button id="admin-btn" class="admin-btn" onclick="askPassword()">دخول</button></div>
            <div class="selection-box"><span class="box-label">رقم المحل</span><select id="table-select" class="masa-select" onchange="setShop()"></select></div>
        </div>
    </div>
    <div id="menu-content"></div>
    <div class="cart-bar" id="cart-bar">
        <div class="total-price" id="total-display">0 د.ع</div>
        <button id="send-btn" class="order-btn" onclick="sendOrder()">إرسال الطلب 📤</button>
    </div>
    <div id="msg">تم إرسال الطلب بنجاح! ✅</div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAtU8ALJ5N3VBxbeGPpNk-7", databaseURL: "https://nabda-coffee-default-rtdb.firebaseio.com", projectId: "nabda-coffee", appId: "1:561770469999:web:f2be91da76" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let cart = {}, orderLocation = "";
        const ADMIN_PASSWORD = "2020";

        const select = document.getElementById('table-select');
        for (let i = 1; i <= 80; i++) {
            const opt = document.createElement('option'); opt.value = `محل ${i}`; opt.innerText = `محل ${i}`; select.appendChild(opt);
        }
        orderLocation = select.value;

        function askPassword() {
            if (prompt("كلمة المرور:") === ADMIN_PASSWORD) {
                orderLocation = "الإدارة"; document.getElementById('admin-btn').classList.add('active');
            }
        }
        function setShop() { orderLocation = select.value; document.getElementById('admin-btn').classList.remove('active'); }

        const menuData = [
            { category: "المشروبات الأساسية", items: [{ id: 100, name: "شاي", price: 500 }, { id: 101, name: "ماء", price: 250 }]},
            { category: "قسم القهوة", items: [
                { id: 1, name: "قهوة جقليتية", price: 1000 }, { id: 2, name: "قهوة عربية", price: 1000 }, { id: 3, name: "قهوة تركية", price: 1000 },
                { id: 12, name: "قهوة تركية وسط", price: 1000 }, { id: 4, name: "قهوة عثمانية", price: 1500 }, { id: 5, name: "نسكافيه", price: 1000 }, 
                { id: 6, name: "نسكافيه بالحليب", price: 1500 }, { id: 7, name: "حليب", price: 1000 }
            ]},
            { category: "الموكا و الاسبريسو", items: [
                { id: 8, name: "اسبريسو", price: 1000 }, { id: 9, name: "دبل اسبريسو", price: 1500 }, { id: 10, name: "اسبريسو ماكياتو", price: 1500 },
                { id: 11, name: "لاتيه", price: 1500 }, { id: 80, name: "موکا", price: 1500 }, { id: 81, name: "موکا كراميل", price: 1500 }, 
                { id: 82, name: "موکا شوكولاتة بيضاء", price: 1500 }, { id: 83, name: "كابتشينو", price: 1500 }, { id: 84, name: "شوكولاتة", price: 1500 }, 
                { id: 85, name: "امريكانو", price: 1000 }
            ]},
            { category: "ايس كوفي", items: [
                { id: 20, name: "ايس كوفي", price: 1500 }, { id: 21, name: "ايس لاتيه", price: 1500 }, { id: 22, name: "ايس موكا", price: 1500 }, 
                { id: 86, name: "ايس كابتشينو", price: 1500 }, { id: 23, name: "ايس كراميل موكا", price: 1500 }, { id: 87, name: "ايس امريكانو", price: 1500 }, 
                { id: 24, name: "ايس نبضة", price: 2000 }
            ]},
            { category: "قسم الموهيتو (Mojito)", items: [
                { id: 403, name: "موهيتو ليمون", price: 2000 }, { id: 404, name: "موهيتو بلوبيري", price: 1500 }, { id: 405, name: "موهيتو فراولة", price: 1500 },
                { id: 406, name: "موهيتو اناناس", price: 1500 }, { id: 407, name: "موهيتو مانجو", price: 1500 }
            ]},
            { category: "قسم الميلك شيك", items: [
                { id: 701, name: "ميلك شيك نوتيla", price: 1500 }, { id: 702, name: "ميلك شيك لوتس", price: 1500 }, { id: 703, name: "ميلك شيك فراولة", price: 1500 },
                { id: 704, name: "ميلك شيك فانليا", price: 1500 }, { id: 706, name: "ميلك شيك كراميل", price: 1500 }, { id: 705, name: "ميلك شيك بستاشيو", price: 2000 }
            ]},
            { category: "قسم السموذي", items: [
                { id: 501, name: "سموذي نبضة", price: 2000 }, { id: 502, name: "سموذي موز وليمون", price: 2000 }, { id: 503, name: "سموذي تفاح اخضر", price: 2000 },
                { id: 504, name: "سموذي بلوبيري", price: 2000 }, { id: 505, name: "سموذي اناناس", price: 2000 }
            ]},
            { category: "العصائر الطبيعية", items: [
                { id: 200, name: "كوكتيل نبضة", price: 2000 }, { id: 32, name: "برتقال وليمون", price: 2000 }, { id: 26, name: "عصير ليمون", price: 2000 },
                { id: 33, name: "ليمون ونعناع", price: 2000 }, { id: 31, name: "عصير فراولة", price: 1500 }, { id: 27, name: "عصير برتقال", price: 1500 },
                { id: 28, name: "عصير مانجو", price: 1500 }, { id: 29, name: "عصير اناناس", price: 1500 }, { id: 30, name: "موز بالحليب", price: 1500 }
            ]},
            { category: "الحلويات", items: [
                { id: 301, name: "وافل مشكل", price: 3000 }, { id: 59, name: "وافل نوتيلا", price: 2000 }, { id: 60, name: "وافل لوتس", price: 2000 },
                { id: 61, name: "وافل بستاشيو", price: 2500 }, { id: 601, name: "كيك شوكولاته دائري", price: 1500 }, { id: 602, name: "كيك فراولة دائري", price: 1500 },
                { id: 63, name: "ترليجة كراميل", price: 1500 }, { id: 65, name: "كيك شوكولاتة", price: 1500 }
            ]}
        ];

        function renderMenu() {
            const container = document.getElementById('menu-content');
            let fullHtml = "", total = 0;
            menuData.forEach(cat => {
                fullHtml += `<div class="category-title">${cat.category}</div>`;
                cat.items.forEach(item => {
                    const count = cart[item.id] || 0; total += count * item.price;
                    fullHtml += `<div class="item-card"><div class="item-info"><span class="item-name">${item.name}</span><span class="item-price">${item.price.toLocaleString()} د.ع</span></div><div class="qty-controls"><button class="qty-btn" onclick="updateCart(${item.id}, 1)">+</button><span class="qty-num">${count}</span><button class="qty-btn" style="background:#555" onclick="updateCart(${item.id}, -1)">-</button></div></div>`;
                });
            });
            container.innerHTML = fullHtml;
            document.getElementById('cart-bar').style.display = total > 0 ? "block" : "none";
            document.getElementById('total-display').innerText = `الإجمالي: ${total.toLocaleString()} د.ع`;
        }

        function updateCart(id, change) { cart[id] = (cart[id] || 0) + change; if (cart[id] <= 0) delete cart[id]; renderMenu(); }

        function sendOrder() {
            let summary = [], currentTotal = 0;
            for (let id in cart) {
                let item; menuData.forEach(c => { const found = c.items.find(x => x.id == id); if(found) item = found; });
                summary.push(`${cart[id]}x ${item.name}`); currentTotal += (cart[id] * item.price);
            }
            db.ref('orders').push({ table: orderLocation, items: summary.join(", "), total: currentTotal, time: new Date().toLocaleTimeString('ar-IQ') })
            .then(() => {
                document.getElementById('msg').style.display = "block"; setTimeout(() => { document.getElementById('msg').style.display = "none"; }, 2500);
                cart = {}; renderMenu();
            });
        }
        renderMenu();
    </script>
</body>
</html>
