<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منيو نبضة كوفي</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: #121212; 
            background-image: url('https://nabda-coffee.github.io/images/nabda-coffee-main-image_20.jpg'); 
            background-size: cover; 
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #fff; 
            font-family: sans-serif; 
            margin: 0; 
            padding-bottom: 200px; 
        }
        .header { background: rgba(20, 20, 20, 0.95); padding: 8px 10px; border-bottom: 2px solid #d35400; text-align: center; position: sticky; top: 0; z-index: 1000; }
        .logo-text { font-size: 1.2em; font-weight: bold; color: #d35400; margin-bottom: 5px; }
        .selection-container { display: flex; gap: 5px; justify-content: center; }
        .selection-box { background: rgba(211, 84, 0, 0.15); border: 1px solid #d35400; padding: 4px; border-radius: 10px; flex: 1; }
        .admin-btn { background: #f1c40f; color: #000; border: none; padding: 6px; border-radius: 6px; font-weight: bold; width: 100%; font-size: 0.8em; }
        .masa-select { background: #fff; border: none; padding: 6px; border-radius: 6px; font-weight: bold; width: 100%; text-align: center; font-size: 0.8em; }
        
        .category-title { background: rgba(44, 62, 80, 0.9); padding: 8px 12px; margin-top: 15px; font-weight: bold; color: #f1c40f; border-right: 5px solid #d35400; font-size: 1em; }
        .item-card { background: rgba(30, 30, 30, 0.85); border-radius: 15px; margin: 8px; padding: 10px; display: flex; align-items: center; justify-content: space-between; border: 1px solid rgba(255,255,255,0.05); }
        .item-info { flex: 1; text-align: right; margin-right: 10px; }
        .item-name { font-size: 0.95em; font-weight: bold; display: block; }
        .item-price { color: #f1c40f; font-weight: bold; font-size: 0.85em; }
        
        .qty-controls { display: flex; align-items: center; background: rgba(0,0,0,0.4); border-radius: 20px; padding: 2px; }
        .qty-btn { background: #d35400; color: white; border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .qty-num { margin: 0 10px; font-weight: bold; font-size: 1.1em; min-width: 15px; text-align: center; }

        .cart-bar { position: fixed; bottom: 0; width: 100%; background: rgba(15, 15, 15, 0.98); border-top: 3px solid #27ae60; padding: 12px; display: none; z-index: 2000; }
        .total-price { text-align: center; margin-bottom: 8px; font-size: 1.3em; color: #f1c40f; font-weight: bold; }
        .order-btn { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 1.1em; font-weight: bold; width: 100%; }
        
        #timer-box { display: none; background: #c0392b; color: white; padding: 12px; border-radius: 10px; text-align: center; font-weight: bold; margin-bottom: 8px; }
        .cancel-btn { background: #fff; color: #c0392b; border: none; padding: 5px 15px; border-radius: 5px; margin-top: 5px; cursor: pointer; font-weight: bold; }
        #last-order-summary { display: none; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px; font-size: 0.85em; border: 1px dashed #27ae60; text-align: center; }
        
        #msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #27ae60; color: white; padding: 20px; border-radius: 15px; display: none; z-index: 3000; }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="logo-text">نبضة كوفي ☕</h1>
        <div class="selection-container">
            <div class="selection-box"><button id="admin-btn" class="admin-btn" onclick="askPassword()">الإدارة</button></div>
            <div class="selection-box"><select id="table-select" class="masa-select" onchange="setShop()"></select></div>
        </div>
    </div>

    <div id="menu-content"></div>

    <div class="cart-bar" id="cart-bar">
        <div id="timer-box">
            <div>يرجى الانتظار: <span id="seconds">60</span> ثانية</div>
            <button class="cancel-btn" onclick="cancelOrder()">إلغاء الطلب ❌</button>
        </div>
        <div class="total-price" id="total-display">0 د.ع</div>
        <button id="send-btn" class="order-btn" onclick="sendOrder()">إرسال الطلب 📥</button>
        <div id="last-order-summary">
            <strong>طلبك الأخير:</strong> <span id="summary-text"></span>
        </div>
    </div>

    <div id="msg">تم إرسال الطلب بنجاح! ✅</div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAtU8ALJ5N3VBxbeGPpNk-7", databaseURL: "https://nabda-coffee-default-rtdb.firebaseio.com", projectId: "nabda-coffee", appId: "1:561770469999:web:f2be91da76" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let cart = {}, orderLocation = "", currentOrderKey = null;
        const ADMIN_PASSWORD = "2020";

        const select = document.getElementById('table-select');
        for (let i = 1; i <= 80; i++) {
            const opt = document.createElement('option'); opt.value = `محل ${i}`; opt.innerText = `محل ${i}`; select.appendChild(opt);
        }
        orderLocation = select.value;

        function askPassword() { if (prompt("كلمة المرور:") === ADMIN_PASSWORD) { orderLocation = "الإدارة"; document.getElementById('admin-btn').style.background = "#27ae60"; } }
        function setShop() { orderLocation = select.value; document.getElementById('admin-btn').style.background = "#f1c40f"; }

        const menuData = [
            { category: "المشروبات الأساسية", items: [{ id: 100, name: "شاي", price: 500 }, { id: 101, name: "ماء", price: 250 }]},
            { category: "قسم القهوة", items: [{ id: 1, name: "قهوة جقليتية", price: 1000 }, { id: 2, name: "قهوة عربية", price: 1000 }, { id: 3, name: "قهوة تركية", price: 1000 }, { id: 12, name: "قهوة تركية وسط", price: 1000 }, { id: 4, name: "قهوة عثمانية", price: 1500 }, { id: 5, name: "نسكافيه", price: 1000 }, { id: 6, name: "نسكافيه بالحليب", price: 1500 }, { id: 7, name: "حليب", price: 1000 }]},
            { category: "الموكا و الاسبريسو", items: [{ id: 8, name: "اسبريسو", price: 1000 }, { id: 9, name: "دبل اسبريسو", price: 1500 }, { id: 10, name: "اسبريسو ماكياتو", price: 1500 }, { id: 11, name: "لاتيه", price: 1500 }, { id: 80, name: "موکا", price: 1500 }, { id: 81, name: "موکا كراميل", price: 1500 }, { id: 82, name: "موکا شوكولاتة بيضاء", price: 1500 }, { id: 83, name: "كابتشينو", price: 1500 }, { id: 84, name: "شوكولاتة", price: 1500 }, { id: 85, name: "امريكانو", price: 1000 }]},
            { category: "ايس كوفي", items: [{ id: 20, name: "ايس كوفي", price: 1500 }, { id: 21, name: "ايس لاتيه", price: 1500 }, { id: 22, name: "ايس moکا", price: 1500 }, { id: 86, name: "ايس كابتشينو", price: 1500 }, { id: 23, name: "ايس كراميل موكا", price: 1500 }, { id: 87, name: "ايس امريكانو", price: 1500 }, { id: 24, name: "ايس نبضة", price: 2000 }]},
            { category: "قسم الموهيتو", items: [{ id: 403, name: "موهيتو ليمون", price: 2000 }, { id: 404, name: "موهيتو بلوبيري", price: 1500 }, { id: 405, name: "موهيتو فراولة", price: 1500 }, { id: 406, name: "موهيتو اناناس", price: 1500 }, { id: 407, name: "موهيتو مانجو", price: 1500 }]},
            { category: "قسم الميلك şik", items: [{ id: 701, name: "ميلك شيك نوتيلا", price: 1500 }, { id: 702, name: "ميلك شيك لوتس", price: 1500 }, { id: 703, name: "ميلك شيك فراولة", price: 1500 }, { id: 704, name: "ميلك شيك فانليا", price: 1500 }, { id: 706, name: "ميلك شيك كراميل", price: 1500 }, { id: 705, name: "ميلك شيك بستاشيو", price: 2000 }]},
            { category: "قسم السموذي", items: [{ id: 501, name: "سموذي نبضة", price: 2000 }, { id: 502, name: "سموذي موز وليمون", price: 2000 }, { id: 503, name: "سموذي تفاح اخضر", price: 2000 }, { id: 504, name: "سموذي بلوبيري", price: 2000 }, { id: 505, name: "سموذي اناناس", price: 2000 }]},
            { category: "العصائر الطبيعية", items: [
                { id: 200, name: "كوكتيل نبضة", price: 2000 }, 
                { id: 32, name: "برتقال وليمون", price: 2000 }, 
                { id: 26, name: "عصير ليمون", price: 2000 }, 
                { id: 33, name: "ليمون ونعناع", price: 2000 }, 
                { id: 31, name: "عصير فراولة", price: 1500 }, 
                { id: 27, name: "عصير برتقال", price: 1500 },
                { id: 25, name: "عصير خوخ", price: 1500 }, // Şeftali suyu artık Portakal'ın altında
                { id: 28, name: "عصير مانجو", price: 1500 }, 
                { id: 29, name: "عصير اناناس", price: 1500 }, 
                { id: 30, name: "موز بالحليب", price: 1500 }
            ]},
            { category: "الحلويات", items: [{ id: 301, name: "وافل مشكل", price: 3000 }, { id: 59, name: "وافل نوتيلا", price: 2000 }, { id: 60, name: "وافل لوتس", price: 2000 }, { id: 61, name: "وافل بستاشيو", price: 2500 }, { id: 601, name: "كيك شوكولاته دائري", price: 1500 }, { id: 602, name: "كيك فراولة دائري", price: 1500 }, { id: 63, name: "ترليجة كراميل", price: 1500 }, { id: 65, name: "كيك شوكولاتة", price: 1500 }]}
        ];

        function renderMenu() {
            const container = document.getElementById('menu-content');
            let fullHtml = "", total = 0;
            menuData.forEach(cat => {
                fullHtml += `<div class="category-title">${cat.category}</div>`;
                cat.items.forEach(item => {
                    const count = cart[item.id] || 0; total += count * item.price;
                    fullHtml += `<div class="item-card"><div class="item-info"><span class="item-name">${item.name}</span><span class="item-price">${item.price.toLocaleString()} د.ع</span></div><div class="qty-controls"><button class="qty-btn" onclick="updateCart(${item.id}, 1)">+</button><span class="qty-num">${count}</span><button class="qty-btn" style="background:#555" onclick="updateCart(${item.id}, -1)">-</button></div></div>`;
                });
            });
            container.innerHTML = fullHtml;
            const bar = document.getElementById('cart-bar');
            if(total > 0 || document.getElementById('timer-box').style.display === "block") bar.style.display = "block";
            document.getElementById('total-display').innerText = `الإجمالي: ${total.toLocaleString()} د.ع`;
        }

        function updateCart(id, change) { cart[id] = (cart[id] || 0) + change; if (cart[id] <= 0) delete cart[id]; renderMenu(); }

        function sendOrder() {
            let summary = [], currentTotal = 0;
            for (let id in cart) {
                let item; menuData.forEach(c => { const found = c.items.find(x => x.id == id); if(found) item = found; });
                summary.push(`${cart[id]}x ${item.name}`); currentTotal += (cart[id] * item.price);
            }
            if (summary.length === 0) return;

            const newOrder = db.ref('orders').push();
            currentOrderKey = newOrder.key;
            newOrder.set({ table: orderLocation, items: summary.join(", "), total: currentTotal, time: new Date().toLocaleTimeString('ar-IQ') })
            .then(() => {
                startTimer(summary.join(", "));
                document.getElementById('msg').style.display = "block"; 
                setTimeout(() => { document.getElementById('msg').style.display = "none"; }, 2000);
                cart = {}; renderMenu();
            });
        }

        let countdownInterval;
        function startTimer(summaryText) {
            const btn = document.getElementById('send-btn');
            const timerBox = document.getElementById('timer-box');
            const summaryBox = document.getElementById('last-order-summary');
            const summarySpan = document.getElementById('summary-text');
            const secondsSpan = document.getElementById('seconds');

            btn.style.display = "none";
            timerBox.style.display = "block";
            summaryBox.style.display = "block";
            summarySpan.innerText = summaryText;

            let timeLeft = 60;
            secondsSpan.innerText = timeLeft;
            
            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                timeLeft--;
                secondsSpan.innerText = timeLeft;
                if (timeLeft <= 0) { resetUI(); }
            }, 1000);
        }

        function cancelOrder() {
            if(currentOrderKey && confirm("هل تريد إلغاء الطلب؟")) {
                db.ref('orders/' + currentOrderKey).remove();
                alert("تم إلغاء الطلب! ❌");
                resetUI();
            }
        }

        function resetUI() {
            clearInterval(countdownInterval);
            document.getElementById('send-btn').style.display = "block";
            document.getElementById('timer-box').style.display = "none";
            document.getElementById('last-order-summary').style.display = "none";
            currentOrderKey = null;
            if (Object.keys(cart).length === 0) document.getElementById('cart-bar').style.display = "none";
        }

        renderMenu();
    </script>
</body>
</html>
