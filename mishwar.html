<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشوار إكسبريس</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #f8f9fa; font-family: sans-serif; margin: 0; padding-bottom: 20px; }
        .header { background: #ff6b00; color: white; padding: 20px; text-align: center; font-size: 1.5em; font-weight: bold; }
        .card { background: white; margin: 15px; padding: 15px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .btn { background: #ff6b00; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 20px; display: none; z-index: 1000; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ff6b00; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; }
        input { padding: 15px; border-radius: 10px; border: none; width: 80%; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="toast"></div>
    <div id="login-screen">
        <h1 style="color:white;">مشوار 🚀</h1>
        <input type="text" id="u-name" placeholder="الاسم">
        <input type="tel" id="u-phone" placeholder="رقم الهاتف">
        <button class="btn" style="background:#222; width:85%;" onclick="login()">دخول</button>
    </div>
    <div class="header">مشوار إكسبريس</div>
    <div class="card">
        <h3>بركة كباب 🍢</h3>
        <button class="btn" onclick="order('بركة كباب', 'نفر كباب', '12000')">اطلب نفر كباب (12000)</button>
    </div>
    <div class="card">
        <h3>Nabdda Coffee ☕</h3>
        <button class="btn" onclick="order('Nabdda Coffee', 'كابتشينو', '3500')">اطلب كابتشينو (3500)</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAtU8ALJ5N3VBxbeGPpNk-790fA4MBP8nk",
            databaseURL: "https://nabda-coffee-default-rtdb.firebaseio.com",
            projectId: "nabda-coffee"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function showT(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function login() {
            const n = document.getElementById('u-name').value;
            const p = document.getElementById('u-phone').value;
            if(n && p) {
                localStorage.setItem('m_n', n); localStorage.setItem('m_p', p);
                document.getElementById('login-screen').style.display = 'none';
            }
        }
        if(localStorage.getItem('m_n')) document.getElementById('login-screen').style.display = 'none';

        function order(r, i, p) {
            const data = {
                customer: localStorage.getItem('m_n'),
                phone: localStorage.getItem('m_p'),
                restaurant: r,
                item: i + " (" + p + " IQD)",
                status: "waiting",
                time: new Date().toLocaleTimeString()
            };
            db.ref('mishwar_orders').push(data).then(() => showT("✅ تم ارسال طلبك"));
        }
    </script>
</body>
</html>
