<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mishwar Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #5d3ebc; --y: #ffd200; --bg: #f3f3f6; --w: #ffffff; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; padding-bottom: 100px; overflow-x: hidden; }
        
        /* Sayfa Düzeni */
        .page { display: none; min-height: 100vh; }
        .page.active { display: block; }
        .header { background: var(--p); padding: 15px; text-align: center; color: var(--y); font-weight: 800; font-size: 1.5rem; position: sticky; top:0; z-index:100; }

        /* Orta Buton İçin Özel Panel */
        #special-panel { 
            position: fixed; top: 100%; left: 0; width: 100%; height: 100%; 
            background: rgba(93, 62, 188, 0.95); z-index: 3000; 
            transition: 0.4s ease-in-out; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
        }
        #special-panel.open { top: 0; }
        .close-special { position: absolute; top: 40px; right: 30px; font-size: 2rem; cursor: pointer; }
        .special-item { background: white; color: var(--p); padding: 20px; border-radius: 20px; width: 80%; margin: 10px; text-align: center; font-weight: 800; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        /* Alt Navigasyon */
        .nav { position: fixed; bottom: 0; width: 100%; background: white; height: 80px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #eee; z-index: 2000; }
        .nav-item { text-align: center; color: #bbb; cursor: pointer; flex: 1; font-size: 0.7rem; font-weight: 700; }
        .nav-item.active { color: var(--p); }
        .nav-item i { font-size: 1.6rem; display: block; font-style: normal; }
        
        /* Orta Buton Tasarımı */
        .mid-btn { 
            font-size: 2.8rem !important; color: var(--p); transform: translateY(-5px); 
            transition: 0.3s; 
        }
        .mid-btn:active { transform: translateY(-5px) scale(0.9); }
    </style>
</head>
<body>

    <div id="home" class="page active">
        <div class="header">mishwar</div>
        <div style="padding: 20px; text-align: center;">🚀 Hoş geldin Basha! Restoranlar aşağıda.</div>
    </div>

    <div id="search" class="page">
        <div class="header">بحث</div>
        <div style="padding: 20px;"><input type="text" placeholder="Ne aramıştınız?" style="width:100%; padding:15px; border-radius:10px; border:1px solid #ddd;"></div>
    </div>

    <div id="profile" class="page">
        <div class="header">حسابي</div>
        <div style="padding: 50px; text-align: center;">👤 Profil Ayarları</div>
    </div>

    <div id="special-panel">
        <div class="close-special" onclick="toggleSpecial()">✕</div>
        <h2 style="margin-bottom: 30px;">🌟 العروض الخاصة (Özel Teklifler)</h2>
        <div class="special-item">🔥 خصم 50% على الكباب</div>
        <div class="special-item">🥤 مشروب مجاني مع كل طلب</div>
        <div class="special-item">⚡ توصيل فائق السرعة</div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="showPage('home', this)"><i>🏠</i>الرئيسية</div>
        <div class="nav-item" onclick="showPage('search', this)"><i>🔍</i>بحث</div>
        
        <div class="nav-item mid-btn" onclick="toggleSpecial()">⊕</div>
        
        <div class="nav-item" onclick="showPage('profile', this)"><i>👤</i>حسابي</div>
        <div class="nav-item" onclick="alert('Yakında!')"><i>🎁</i>عروض</div>
    </div>

    <script>
        function showPage(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            // Panel açıksa kapat
            document.getElementById('special-panel').classList.remove('open');
        }

        function toggleSpecial() {
            document.getElementById('special-panel').classList.toggle('open');
        }
    </script>
</body>
</html>
