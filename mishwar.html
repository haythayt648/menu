<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب جديد | Mishwar</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #fdfdfd; font-family: sans-serif; margin: 0; padding: 0; }
        .header { background: #ff6b00; color: white; padding: 25px; text-align: center; font-size: 1.6em; font-weight: bold; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; }
        .shop-card { background: white; margin: 20px; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border: 1px solid #eee; text-align: center; }
        .btn-order { background: #ff6b00; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 1em; }
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 25px; border-radius: 30px; display: none; z-index: 9999; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #login { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ff6b00; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; }
        input { padding: 15px; border-radius: 12px; border: none; width: 80%; margin-bottom: 15px; font-size: 1em; text-align: center; }
    </style>
</head>
<body>
    <div id="toast"></div>

    <div id="login">
        <h1 style="color:white; margin-bottom:30px;">مشوار إكسبريس 🚀</h1>
        <input type="text" id="cust-name" placeholder="اكتب اسمك هنا">
        <input type="tel" id="cust-phone" placeholder="رقم الموبايل">
        <button onclick="saveUser()" style="padding:15px; width:85%; border-radius:12px; border:none; background:#222; color:white; font-weight:bold; font-size:1.1em;">ابدأ الطلب</button>
    </div>

    <div class="header">قائمة المطاعم</div>

    <div class="shop-card">
        <h2 style="margin-top:0;">بركة كباب 🍢</h2>
        <button class="btn-order" onclick="sendOrder('بركة كباب', 'نفر كباب مشوي', '12000')">اطلب نفر كباب (12000)</button>
    </div>

    <div class="shop-card">
        <h2 style="margin-top:0;">Nabdda Coffee ☕</h2>
        <button class="btn-order" onclick="sendOrder('Nabdda Coffee', 'كابتشينو بارد', '3500')">اطلب كابتشينو (3500)</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAtU8ALJ5N3VBxbeGPpNk-790fA4MBP8nk",
            databaseURL: "https://nabda-coffee-default-rtdb.firebaseio.com",
            projectId: "nabda-coffee"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function msg(t) {
            const el = document.getElementById('toast');
            el.innerText = t; el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 2500);
        }

        function saveUser() {
            const n = document.getElementById('cust-name').value;
            const p = document.getElementById('cust-phone').value;
            if(n && p) {
                localStorage.setItem('u_n', n); localStorage.setItem('u_p', p);
                document.getElementById('login').style.display = 'none';
            } else { alert("يرجى كتابة الاسم والهاتف"); }
        }
        if(localStorage.getItem('u_n')) document.getElementById('login').style.display = 'none';

        function sendOrder(rest, dish, price) {
            const orderObj = {
                customer: localStorage.getItem('u_n'),
                phone: localStorage.getItem('u_p'),
                restaurant: rest,
                item: dish + " (" + price + " IQD)",
                status: "waiting",
                time: new Date().toLocaleTimeString()
            };
            db.ref('mishwar_orders').push(orderObj).then(() => msg("✅ تم إرسال طلبك إلى الباشا"));
        }
    </script>
</body>
</html>
