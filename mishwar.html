<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mishwar | مشوار</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --purple: #5d3ebc; --yellow: #ffd200; --bg: #f3f3f6; --white: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; padding-bottom: 100px; color: #333; }

        /* Header & Address */
        .header { background: var(--purple); padding: 15px; display: flex; align-items: center; justify-content: center; position: sticky; top: 0; z-index: 1000; }
        .header .logo { color: var(--yellow); font-weight: 800; font-size: 1.5rem; }
        .address-section { background: var(--white); padding: 12px 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 600; }
        .address-section input { border: none; outline: none; flex-grow: 1; font-family: inherit; font-size: 0.85rem; color: var(--purple); }

        /* Categories */
        .cats-container { background: var(--white); display: flex; overflow-x: auto; padding: 15px; gap: 15px; scrollbar-width: none; }
        .cat-item { min-width: 70px; text-align: center; }
        .cat-icon { width: 60px; height: 60px; background: var(--bg); border-radius: 15px; margin: 0 auto 5px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .cat-item span { font-size: 0.75rem; font-weight: 700; }

        /* Restaurant List */
        .res-list { padding: 15px; }
        .res-card { background: var(--white); border-radius: 20px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); cursor: pointer; position: relative; }
        .res-img { width: 100%; height: 180px; object-fit: cover; }
        .res-info { padding: 15px; }
        .res-title { font-size: 1.1rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .res-rating { color: var(--purple); font-size: 0.9rem; }
        .res-details { font-size: 0.8rem; color: #777; margin-top: 5px; }
        .res-badge { position: absolute; top: 15px; right: 15px; background: var(--white); padding: 5px 12px; border-radius: 10px; font-weight: bold; font-size: 0.75rem; color: var(--purple); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        /* Menu Sheet (Slide Up) */
        #menu-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; height: 90%; background: var(--white); z-index: 2000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 30px 30px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); overflow-y: auto; }
        #menu-sheet.active { bottom: 0; }
        .sheet-header { padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--white); z-index: 10; border-radius: 30px 30px 0 0; }
        .close-btn { color: var(--purple); font-weight: 800; cursor: pointer; font-size: 1.2rem; }

        /* Products */
        .product-card { display: flex; padding: 20px; border-bottom: 1px solid #f9f9f9; align-items: center; justify-content: space-between; }
        .p-info { flex-grow: 1; }
        .p-name { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
        .p-price { color: var(--purple); font-weight: 800; font-size: 0.95rem; }
        .p-controls { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #eee; padding: 5px 12px; border-radius: 12px; box-shadow: 0 3px 8px rgba(0,0,0,0.04); }
        .btn-act { border: none; background: none; color: var(--purple); font-size: 1.5rem; font-weight: bold; cursor: pointer; width: 30px; }
        .qty-val { color: var(--purple); font-weight: 800; min-width: 20px; text-align: center; }

        /* Floating Bottom Cart Bar */
        .cart-bar { position: fixed; bottom: 25px; left: 5%; width: 90%; background: var(--purple); color: var(--white); padding: 18px; border-radius: 18px; display: none; justify-content: space-between; align-items: center; font-weight: 700; z-index: 3000; box-shadow: 0 10px 25px rgba(93, 62, 188, 0.4); }
        .min-alert { background: #ff4444; color: white; padding: 8px; text-align: center; font-size: 0.8rem; font-weight: bold; position: fixed; bottom: 95px; width: 100%; display: none; }

        /* Simple Bottom Nav */
        .footer-nav { position: fixed; bottom: 0; width: 100%; background: var(--white); height: 70px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #eee; }
        .nav-link { text-align: center; color: #ccc; text-decoration: none; font-size: 0.7rem; font-weight: bold; }
        .nav-link.active { color: var(--purple); }
        .nav-link i { font-size: 1.5rem; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="header"><div class="logo">mishwar</div></div>

    <div class="address-section">
        📍 <input type="text" id="user-addr" placeholder="أدخل عنوان التوصيل يا باشا (مطلوب)...">
    </div>

    <div class="cats-container">
        <div class="cat-item"><div class="cat-icon">🍗</div><span>مطاعم</span></div>
        <div class="cat-item"><div class="cat-icon">☕</div><span>كافيهات</span></div>
        <div class="cat-item"><div class="cat-icon">💊</div><span>صيدلية</span></div>
        <div class="cat-item"><div class="cat-icon">🛒</div><span>ماركت</span></div>
        <div class="cat-item"><div class="cat-icon">🍰</div><span>حلويات</span></div>
    </div>

    <div class="res-list">
        <div class="res-card" onclick="showMenu('بركة كباب', [{n:'كباب نفر', p:12000}, {n:'تكة دجاج', p:10000}, {n:'كفتة مشوية', p:11500}])">
            <div class="res-badge">توصيل مجاني ✨</div>
            <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=600" class="res-img">
            <div class="res-info">
                <div class="res-title">بركة كباب (الشيف باشa) <span class="res-rating">★ 5.0</span></div>
                <div class="res-details">🕒 20-30 دقيقة • الحد الأدنى 5,000 د.ع</div>
            </div>
        </div>

        <div class="res-card" onclick="showMenu('Nabdda Coffee', [{n:'كابتشينو', p:3500}, {n:'وافل نوتيلا', p:5000}, {n:'لاتيه بارد', p:4000}])">
            <img src="https://images.unsplash.com/photo-1501339817302-ec44d142b11a?w=600" class="res-img">
            <div class="res-info">
                <div class="res-title">Nabdda Coffee <span class="res-rating">★ 4.9</span></div>
                <div class="res-details">🕒 10-15 دقيقة • الحد الأدنى 3,000 د.ع</div>
            </div>
        </div>
    </div>

    <div id="menu-sheet">
        <div class="sheet-header">
            <span id="shop-name" style="font-weight: 800; font-size: 1.2rem;">Menü</span>
            <span class="close-btn" onclick="hideMenu()">إغلاق ✕</span>
        </div>
        <div id="items-list"></div>
    </div>

    <div id="min-warn" class="min-alert">الحد الأدنى للطلب هو 5,000 د.ع</div>

    <div id="cart-footer" class="cart-bar" onclick="finalizeOrder()">
        <span id="total-val">0 د.ع</span>
        <span>تأكيد الطلب ➔</span>
    </div>

    <div class="footer-nav">
        <a href="#" class="nav-link active">🏠<br>الرئيسية</a>
        <a href="#" class="nav-link">🔍<br>بحث</a>
        <a href="#" class="nav-link" style="font-size: 2rem; color: var(--purple);">➕</a>
        <a href="#" class="nav-link">👤<br>حسابي</a>
        <a href="#" class="nav-link">🎁<br>عروض</a>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAtU8ALJ5N3VBxbeGPpNk-790fA4MBP8nk",
            databaseURL: "https://nabda-coffee-default-rtdb.firebaseio.com",
            projectId: "nabda-coffee"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let cart = {};
        let activeShop = "";

        function showMenu(name, items) {
            activeShop = name;
            document.getElementById('shop-name').innerText = name;
            const container = document.getElementById('items-list');
            container.innerHTML = items.map(item => `
                <div class="product-card">
                    <div class="p-info">
                        <div class="p-name">${item.n}</div>
                        <div class="p-price">${item.p.toLocaleString()} د.ع</div>
                    </div>
                    <div class="p-controls">
                        <button class="btn-act" onclick="updateItem('${item.n}', ${item.p}, -1)">-</button>
                        <span class="qty-val" id="q-${item.n}">${cart[item.n]?.qty || 0}</span>
                        <button class="btn-act" onclick="updateItem('${item.n}', ${item.p}, 1)">+</button>
                    </div>
                </div>
            `).join('');
            document.getElementById('menu-sheet').classList.add('active');
        }

        function hideMenu() { document.getElementById('menu-sheet').classList.remove('active'); }

        function updateItem(name, price, delta) {
            if (!cart[name]) cart[name] = { price, qty: 0 };
            cart[name].qty = Math.max(0, cart[name].qty + delta);
            document.getElementById(`q-${name}`).innerText = cart[name].qty;
            
            refreshCart();
        }

        function refreshCart() {
            let total = 0;
            for (let key in cart) total += cart[key].price * cart[key].qty;
            
            document.getElementById('total-val').innerText = total.toLocaleString() + " د.ع";
            document.getElementById('cart-footer').style.display = total > 0 ? 'flex' : 'none';
            
            // Minimum limit check (e.g., 5000 IQD)
            const minWarn = document.getElementById('min-warn');
            if (total > 0 && total < 5000) {
                minWarn.style.display = 'block';
                document.getElementById('cart-footer').style.opacity = '0.6';
                document.getElementById('cart-footer').style.pointerEvents = 'none';
            } else {
                minWarn.style.display = 'none';
                document.getElementById('cart-footer').style.opacity = '1';
                document.getElementById('cart-footer').style.pointerEvents = 'auto';
            }
        }

        function finalizeOrder() {
            const addr = document.getElementById('user-addr').value;
            if (!addr) { alert("أدخل عنوانك أولاً يا باشا!"); return; }

            let orderList = Object.entries(cart).filter(i => i[1].qty > 0).map(i => `${i[0]} (x${i[1].qty})`).join(", ");
            let totalVal = document.getElementById('total-val').innerText;

            db.ref('orders').push({
                shop: activeShop,
                items: orderList,
                address: addr,
                total: totalVal,
                status: "جديد",
                timestamp: Date.now()
            }).then(() => {
                alert("تم إرسال طلبك بنجاح! 🚀🔥");
                location.reload();
            });
        }
    </script>
</body>
</html>
