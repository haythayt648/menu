<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mishwar Pro</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #5d3ebc; --y: #ffd200; --bg: #f3f3f6; --w: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); overflow-x: hidden; height: 100vh; }

        /* Sayfa Yönetimi */
        .page { display: none; min-height: 100vh; padding-bottom: 100px; }
        .page.active { display: block; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Header & Adres */
        .header { background: var(--p); padding: 15px; text-align: center; color: var(--y); font-weight: 800; font-size: 1.5rem; position: sticky; top:0; z-index:100; }
        .addr { background: white; padding: 12px; border-bottom: 2px solid var(--p); display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.85rem; }
        .addr input { border: none; flex: 1; font-family: inherit; color: var(--p); }

        /* Kartlar */
        .res-card { background: white; border-radius: 20px; margin: 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; }
        .res-card img { width: 100%; height: 160px; object-fit: cover; }
        .res-info { padding: 15px; }

        /* Alt Navigasyon */
        .nav { position: fixed; bottom: 0; width: 100%; background: white; height: 75px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #eee; z-index: 2000; }
        .nav-item { text-align: center; color: #bbb; cursor: pointer; flex: 1; font-size: 0.7rem; font-weight: 700; }
        .nav-item.active { color: var(--p); }
        .nav-item i { font-size: 1.5rem; display: block; margin-bottom: 2px; font-style: normal; }
        
        /* Orta Buton Özel Panel */
        #mid-panel { position: fixed; bottom: -100%; left: 0; width: 100%; height: 100%; background: rgba(93, 62, 188, 0.98); z-index: 3000; transition: 0.4s; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        #mid-panel.open { bottom: 0; }
        .special-box { background: white; color: var(--p); padding: 15px 30px; border-radius: 15px; margin: 10px; font-weight: 800; width: 80%; text-align: center; }

        /* Başarı Bildirimi (Alert yerine şık bir pop-up) */
        #toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: #2ecc71; color: white; padding: 12px 25px; border-radius: 50px; font-weight: 800; z-index: 5000; transition: 0.5s; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div id="toast">تم الإرسال بنجاح! 🚀</div>

    <div id="home" class="page active">
        <div class="header">mishwar</div>
        <div class="addr">📍 <input type="text" id="user-location" placeholder="أدخل عنوان التوصيل..."></div>
        <div class="res-card" onclick="openStore()">
            <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=600">
            <div class="res-info"><b>بركة كباب</b><br><small>🕒 20-30 دقيقة</small></div>
        </div>
    </div>

    <div id="search" class="page">
        <div class="header">بحث</div>
        <div style="padding:20px;"><input type="text" placeholder="ماذا تبحث عنه؟" style="width:100%; padding:15px; border-radius:12px; border:1px solid #ddd;"></div>
    </div>

    <div id="profile" class="page">
        <div class="header">حسابي</div>
        <div style="text-align:center; padding-top:50px;">👤<br><b>أهلاً بك يا باشا</b></div>
    </div>

    <div id="mid-panel">
        <div style="position:absolute; top:40px; right:30px; font-size:2rem;" onclick="closeMid()">✕</div>
        <h2>🌟 عروض خاصة</h2>
        <div class="special-box">كباب عائلي - خصم 20%</div>
        <div class="special-box">توصيل مجاني اليوم</div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="go('home', this)"><i>🏠</i>الرئيسية</div>
        <div class="nav-item" onclick="go('search', this)"><i>🔍</i>بحث</div>
        <div class="nav-item" style="font-size:2.5rem; color:var(--p);" onclick="openMid()">⊕</div>
        <div class="nav-item" onclick="go('profile', this)"><i>👤</i>حسابي</div>
        <div class="nav-item" onclick="showToast('العروض قريباً!')"><i>🎁</i>عروض</div>
    </div>

    <script>
        function go(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            closeMid();
        }

        function openMid() { document.getElementById('mid-panel').classList.add('open'); }
        function closeMid() { document.getElementById('mid-panel').classList.remove('open'); }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.top = '30px';
            setTimeout(() => { t.style.top = '-100px'; }, 2500);
        }

        // Dükkan açma vs. artık alert vermeyecek, sessizce işlem yapacak.
        function openStore() {
            showToast("جاري تحميل المتجر...");
        }
    </script>
</body>
</html>
