<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mishwar Express | مشوار</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --main: #ff6b00; --dark: #222; }
        body { background: #f4f4f7; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding-bottom: 80px; }
        .nav-top { background: var(--main); color: white; padding: 20px; text-align: center; font-size: 1.4em; font-weight: bold; border-radius: 0 0 25px 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .section-title { padding: 15px; font-weight: bold; color: var(--dark); font-size: 1.2em; }
        .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px; }
        .shop-card { background: white; border-radius: 15px; padding: 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: 0.3s; }
        .shop-card:active { transform: scale(0.95); }
        .shop-card i { font-size: 2em; display: block; margin-bottom: 10px; }
        
        /* Sepet Barı */
        .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--dark); color: white; padding: 15px; display: none; justify-content: space-between; align-items: center; border-radius: 20px 20px 0 0; z-index: 1000; }
        .btn-confirm { background: var(--main); border: none; color: white; padding: 10px 20px; border-radius: 10px; font-weight: bold; }
        
        /* Modal (Ürün Listesi) */
        #menu-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: none; z-index: 2000; overflow-y: auto; }
        .menu-item { display: flex; justify-content: space-between; padding: 20px; border-bottom: 1px solid #eee; align-items: center; }
        .add-btn { background: var(--main); color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="nav-top">مشوار إكسبريس 🚀</div>

    <div class="section-title">المطاعم والأسواق</div>
    <div class="shop-grid">
        <div class="shop-card" onclick="openShop('Nabdda Coffee', [['قهوة تركية', 1000], ['لاتيه', 2000], ['ايس كوفي', 1500]])">☕ Nabdda Coffee</div>
        <div class="shop-card" onclick="openShop('بركة كباب', [['نفر كباب', 12000], ['تكة دجاج', 10000]])">🍢 بركة كباب</div>
        <div class="shop-card" onclick="openShop('حلويات السلطان', [['وافل مشكل', 3500], ['كيك شوكولاتة', 1500]])">🍰 الحلويات</div>
        <div class="shop-card" onclick="openShop('سوبر ماركت', [['عصير برتقال', 1500], ['مكسيكا ليمون', 2000]])">🛒 الماركت</div>
    </div>

    <div id="cart-bar" class="cart-bar">
        <div>المجموع: <span id="total-price">0</span> د.ع</div>
        <button class="btn-confirm" onclick="checkout()">تأكيد الطلب ✔️</button>
    </div>

    <div id="menu-modal">
        <div class="nav-top" style="border-radius:0;">
            <span onclick="closeShop()" style="float:right; padding-right:20px; cursor:pointer;">X</span>
            <span id="current-shop-name">المحل</span>
        </div>
        <div id="menu-list"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAtU8ALJ5N3VBxbeGPpNk-790fA4MBP8nk",
            databaseURL: "https://nabda-coffee-default-rtdb.firebaseio.com",
            projectId: "nabda-coffee"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let cart = [];
        let total = 0;
        let currentShop = "";

        function openShop(name, items) {
            currentShop = name;
            document.getElementById('current-shop-name').innerText = name;
            const list = document.getElementById('menu-list');
            list.innerHTML = "";
            items.forEach(item => {
                list.innerHTML += `
                    <div class="menu-item">
                        <div><b>${item[0]}</b><br><small>${item[1]} د.ع</small></div>
                        <button class="add-btn" onclick="addToCart('${item[0]}', ${item[1]})">اضافة</button>
                    </div>`;
            });
            document.getElementById('menu-modal').style.display = 'block';
        }

        function closeShop() { document.getElementById('menu-modal').style.display = 'none'; }

        function addToCart(name, price) {
            cart.push(name);
            total += price;
            document.getElementById('total-price').innerText = total;
            document.getElementById('cart-bar').style.display = 'flex';
            // Küçük bir bildirim (Hız için)
            console.log(name + " eklendi");
        }

        function checkout() {
            const data = {
                customer: "Basha Admin", // Burayı kullanıcı logininden alabiliriz
                items: cart.join(", "),
                total: total,
                restaurant: currentShop,
                status: "waiting",
                time: new Date().toLocaleTimeString()
            };
            db.ref('mishwar_orders').push(data).then(() => {
                alert("تم ارسال طلبك بنجاح!");
                cart = []; total = 0;
                document.getElementById('cart-bar').style.display = 'none';
                closeShop();
            });
        }
    </script>
</body>
</html>
