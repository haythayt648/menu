<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mishwar Pro | مشوار</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --main: #5d3ebc; --yellow: #ffd200; --bg: #f3f3f6; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; padding-bottom: 100px; }
        
        /* Adres Bölümü - Zorunlu */
        .address-bar { background: white; padding: 15px; border-bottom: 2px solid var(--main); position: sticky; top: 0; z-index: 1000; }
        .address-input { width: 100%; border: 1px solid #ddd; padding: 10px; border-radius: 8px; font-size: 0.9rem; }

        /* Kategori Filtreleri */
        .cats { display: flex; overflow-x: auto; padding: 15px; gap: 10px; }
        .cat-btn { background: white; padding: 8px 20px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; }

        /* Ürün Kartları */
        .item-card { background: white; margin: 10px 15px; border-radius: 15px; display: flex; align-items: center; padding: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
        .item-img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; }
        .item-info { flex-grow: 1; margin-right: 15px; }
        .add-btn { background: white; border: 1px solid #ddd; color: var(--main); font-weight: bold; padding: 5px 15px; border-radius: 8px; cursor: pointer; }

        /* Ürün Notu Modalı */
        #note-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 3000; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 85%; padding: 20px; border-radius: 20px; text-align: center; }
        .modal-input { width: 100%; height: 80px; margin-top: 10px; border-radius: 10px; border: 1px solid #ddd; padding: 10px; font-family: inherit; }

        /* Alt Sepet Çubuğu */
        .cart-footer { position: fixed; bottom: 0; width: 100%; background: white; padding: 15px; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); display: none; justify-content: space-between; align-items: center; z-index: 2000; }
        .btn-order { background: var(--main); color: white; padding: 12px 30px; border-radius: 12px; font-weight: bold; border: none; }
    </style>
</head>
<body>

    <div class="address-bar">
        <label style="font-size: 0.8rem; font-weight: bold; color: var(--main);">📍 عنوان التوصيل (مطلوب):</label>
        <input type="text" id="user-address" class="address-input" placeholder="اكتب منطقتك ورقم دارك هنا...">
    </div>

    <div class="cats">
        <div class="cat-btn" onclick="filter('all')">الكل</div>
        <div class="cat-btn" onclick="filter('food')">مطاعم</div>
        <div class="cat-btn" onclick="filter('cafe')">كافيهات</div>
        <div class="cat-btn" onclick="filter('pharma')">صيدليات</div>
    </div>

    <div id="items-list">
        </div>

    <div id="cart-footer" class="cart-footer">
        <div>المجموع: <b id="total-price">0</b> د.ع</div>
        <button class="btn-order" onclick="processOrder()">تأكيد الطلب ✔️</button>
    </div>

    <div id="note-modal">
        <div class="modal-content">
            <h3 id="modal-item-name">اسم المنتج</h3>
            <p>أضف ملاحظاتك (اختياري)</p>
            <textarea id="item-note" class="modal-input" placeholder="مثلاً: بدون بصل، صوص زيادة..."></textarea>
            <button class="btn-order" style="margin-top: 15px; width: 100%;" onclick="confirmAdd()">إضافة للسلة</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAtU8ALJ5N3VBxbeGPpNk-790fA4MBP8nk",
            databaseURL: "https://nabda-coffee-default-rtdb.firebaseio.com",
            projectId: "nabda-coffee"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let cart = [];
        let tempItem = null;

        const products = [
            { id: 1, name: "نفر كباب", price: 12000, cat: "food", img: "https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?w=200" },
            { id: 2, name: "كابتشينو", price: 3500, cat: "cafe", img: "https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=200" },
            { id: 3, name: "بنادول ادموند", price: 1500, cat: "pharma", img: "https://images-na.ssl-images-amazon.com/images/I/51r2611N5YL._AC_SL1000_.jpg" }
        ];

        function loadItems() {
            const list = document.getElementById('items-list');
            list.innerHTML = products.map(p => `
                <div class="item-card">
                    <img src="${p.img}" class="item-img">
                    <div class="item-info">
                        <b>${p.name}</b><br>
                        <span style="color:var(--main);">${p.price} د.ع</span>
                    </div>
                    <button class="add-btn" onclick="showNoteModal(${p.id})">إضافة</button>
                </div>
            `).join('');
        }

        function showNoteModal(id) {
            tempItem = products.find(p => p.id === id);
            document.getElementById('modal-item-name').innerText = tempItem.name;
            document.getElementById('item-note').value = "";
            document.getElementById('note-modal').style.display = 'flex';
        }

        function confirmAdd() {
            const note = document.getElementById('item-note').value;
            cart.push({ ...tempItem, note: note });
            document.getElementById('note-modal').style.display = 'none';
            updateCart();
        }

        function updateCart() {
            let total = cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('total-price').innerText = total;
            document.getElementById('cart-footer').style.display = total > 0 ? 'flex' : 'none';
        }

        function processOrder() {
            const addr = document.getElementById('user-address').value;
            if (!addr) {
                alert("Basha! العنوان مطلوب قبل الطلب.");
                return;
            }

            const orderData = {
                items: cart.map(i => `${i.name} (${i.note || 'لا يوجد ملاحظة'})`).join(" - "),
                total: cart.reduce((s, i) => s + i.price, 0),
                address: addr,
                status: "waiting",
                timestamp: Date.now()
            };

            db.ref('mishwar_orders').push(orderData).then(() => {
                alert("تم إرسال الطلب! ✅");
                cart = []; updateCart();
            });
        }

        loadItems();
    </script>
</body>
</html>
