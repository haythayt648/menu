<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAtU8ALJ5N3VBxbeGPpNk-790fA4MBP8nk",
        authDomain: "nabda-coffee.firebaseapp.com",
        databaseURL: "https://nabda-coffee-default-rtdb.firebaseio.com",
        projectId: "nabda-coffee",
        storageBucket: "nabda-coffee.firebasestorage.app",
        messagingSenderId: "561770469999",
        appId: "1:561770469999:web:b47703ce349e0338438b9a"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let selectedItem = "";
    let currentRest = "";

    // Şık bildirim fonksiyonu (O beyaz kutu yerine bu çalışacak)
    function showToast(text) {
        const toast = document.createElement("div");
        toast.innerText = text;
        toast.style = "position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:white; padding:10px 20px; border-radius:20px; z-index:10001; font-size:14px;";
        document.body.appendChild(toast);
        setTimeout(() => { toast.remove(); }, 2000); // 2 saniye sonra kaybolur
    }

    function selectItem(name, price) {
        selectedItem = name + " (" + price + " IQD)";
        document.getElementById('final-order-btn').style.display = 'block';
        showToast("تم اختيار: " + name); // Mesaj kutusu yerine bildirim
    }

    function placeOrder() {
        const orderData = {
            customer: localStorage.getItem('m_user'),
            phone: localStorage.getItem('m_phone'),
            restaurant: currentRest,
            item: selectedItem,
            status: "waiting",
            time: new Date().toLocaleTimeString()
        };

        database.ref('mishwar_orders').push(orderData).then(() => {
            showToast("✅ تم ارسال طلبك بنجاح"); // Mesaj kutusu yerine bildirim
            setTimeout(() => { closeMenu(); }, 1500);
        });
    }

    // Geri kalan fonksiyonlar (showMenu, closeMenu vb.) aynı kalacak...
</script>
