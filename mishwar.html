<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basha Admin | لوحة التحكم</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; padding: 15px; margin: 0; }
        .admin-header { background: #ff6b00; padding: 15px; text-align: center; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .order-card { background: #1e1e1e; border-radius: 15px; padding: 15px; margin-bottom: 15px; border: 1px solid #333; }
        .info { margin-bottom: 15px; font-size: 0.95em; line-height: 1.6; }
        .status-badge { padding: 4px 10px; border-radius: 5px; font-size: 0.8em; font-weight: bold; }
        .waiting { background: #d9534f; }
        .delivered { background: #5cb85c; }
        .btn-group { display: flex; gap: 10px; }
        .action-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; font-size: 0.9em; }
        .btn-done { background: #28a745; }
        .btn-del { background: #444; }
    </style>
</head>
<body>

    <div class="admin-header">
        <h2 style="margin:0;">لوحة تحكم الباشا 👑</h2>
    </div>

    <div id="order-list">جاري تحميل الطلبات... (Siparişler yükleniyor...)</div>

    <script>
        // Senin Firebase Bilgilerin
        const firebaseConfig = {
            apiKey: "AIzaSyAtU8ALJ5N3VBxbeGPpNk-790fA4MBP8nk",
            databaseURL: "https://nabda-coffee-default-rtdb.firebaseio.com",
            projectId: "nabda-coffee"
        };
        
        // Başlatma Kontrolü
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Verileri Çek
        db.ref('mishwar_orders').on('value', (snapshot) => {
            const list = document.getElementById('order-list');
            list.innerHTML = '';
            
            if (!snapshot.exists()) {
                list.innerHTML = '<p style="text-align:center;">Henüz sipariş yok Basha.</p>';
                return;
            }

            snapshot.forEach((child) => {
                const order = child.val();
                const key = child.key;
                const isWaiting = order.status === 'waiting';

                list.innerHTML += `
                    <div class="order-card">
                        <div class="info">
                            <b style="color:#ff6b00;">${order.restaurant}</b><br>
                            <b>الزبون:</b> ${order.customer}<br>
                            <b>الطلب:</b> ${order.item}<br>
                            <b>الحالة:</b> <span class="status-badge ${isWaiting ? 'waiting' : 'delivered'}">
                                ${isWaiting ? 'انتظار' : 'تم التوصيل ✔️'}
                            </span>
                        </div>
                        <div class="btn-group">
                            <button class="action-btn btn-done" onclick="completeOrder('${key}')">تم (Bitti)</button>
                            <button class="action-btn btn-del" onclick="deleteOrder('${key}')">حذف (Sil)</button>
                        </div>
                    </div>`;
            });
        }, (error) => {
            document.getElementById('order-list').innerHTML = "Hata oluştu: " + error.message;
        });

        function completeOrder(id) {
            db.ref('mishwar_orders/' + id).update({ status: 'delivered' });
        }

        function deleteOrder(id) {
            if(confirm('Emin misin Basha? Sipariş silinecek.')) {
                db.ref('mishwar_orders/' + id).remove();
            }
        }
    </script>
</body>
</html>
