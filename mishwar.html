<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mishwar | Getir Tarzı</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --getir-purple: #5d3ebc; --getir-yellow: #ffd200; --bg: #f5f5f5; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); margin: 0; padding-bottom: 100px; }
        
        /* Header */
        .header { background: var(--getir-purple); color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; position: sticky; top: 0; z-index: 1000; }
        
        /* Kategori Kaydırma (Horizontal Scroll) */
        .categories { display: flex; overflow-x: auto; padding: 15px; gap: 10px; background: white; }
        .cat-item { min-width: 80px; text-align: center; font-size: 0.8rem; font-weight: bold; color: #555; }
        .cat-img { width: 60px; height: 60px; background: #eee; border-radius: 15px; margin-bottom: 5px; object-fit: cover; border: 1px solid #ddd; }

        /* Restoran Kartları */
        .restaurant-card { background: white; margin: 15px; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative; }
        .res-img { width: 100%; height: 180px; object-fit: cover; }
        .res-info { padding: 15px; }
        .res-name { font-size: 1.1rem; font-weight: bold; margin: 0; color: #333; }
        .res-meta { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: #666; margin-top: 5px; }
        .rating { color: var(--getir-purple); font-weight: bold; }
        .discount-tag { position: absolute; top: 15px; left: 15px; background: var(--getir-yellow); padding: 5px 10px; border-radius: 8px; font-weight: bold; font-size: 0.8rem; }

        /* Ürün Listesi Modalı */
        #product-modal { position: fixed; bottom: 0; left: 0; width: 100%; height: 85%; background: white; border-radius: 25px 25px 0 0; display: none; z-index: 2000; box-shadow: 0 -5px 20px rgba(0,0,0,0.2); overflow-y: auto; }
        .product-item { display: flex; padding: 20px; border-bottom: 1px solid #f0f0f0; justify-content: space-between; align-items: center; }
        .add-btn { border: 1px solid #ddd; background: white; color: var(--getir-purple); padding: 8px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Alt Sepet Barı */
        .cart-bar { position: fixed; bottom: 20px; left: 5%; width: 90%; background: var(--getir-purple); color: white; padding: 15px; border-radius: 15px; display: none; justify-content: space-between; align-items: center; font-weight: bold; z-index: 3000; }
    </style>
</head>
<body>

    <div class="header">Mishwar Basha 🚀</div>

    <div class="categories">
        <div class="cat-item"><div class="cat-img"></div>Kahvaltı</div>
        <div class="cat-item"><div class="cat-img"></div>Kebap</div>
        <div class="cat-item"><div class="cat-img"></div>Kahve</div>
        <div class="cat-item"><div class="cat-img"></div>Tatlı</div>
    </div>

    <div id="shop-list">
        <div class="restaurant-card" onclick="openMenu('Nabdda Coffee', [['Latte', 2000], ['Espresso', 1000], ['Waffle', 3500]])">
            <div class="discount-tag">%10 İndirim</div>
            <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=500" class="res-img">
            <div class="res-info">
                <p class="res-name">Nabdda Coffee</p>
                <div class="res-meta">
                    <span class="rating">⭐ 4.9</span>
                    <span>• 15-20 dk</span>
                    <span>• Ücretsiz Teslimat</span>
                </div>
            </div>
        </div>

        <div class="restaurant-card" onclick="openMenu('Beraka Kebap', [['Kebab نفر كباب', 12000], ['Tikka تكة دجاج', 10000]])">
            <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500" class="res-img">
            <div class="res-info">
                <p class="res-name">Beraka Kebap (Chef Basha)</p>
                <div class="res-meta">
                    <span class="rating">⭐ 5.0</span>
                    <span>• 25-30 dk</span>
                </div>
            </div>
        </div>
    </div>

    <div id="cart-bar" class="cart-bar">
        <span id="total-price">0 IQD</span>
        <span onclick="confirmOrder()">Siparişi Tamamla ></span>
    </div>

    <div id="product-modal">
        <div style="padding:20px; font-weight:bold; font-size:1.2rem; border-bottom:1px solid #eee;">
            <span onclick="closeMenu()" style="color:var(--getir-purple); margin-right:15px;">✕</span>
            <span id="modal-title">Menü</span>
        </div>
        <div id="product-list"></div>
    </div>

    <script>
        // Firebase ayarların zaten sende var, buraya ekleyebilirsin
        let cart = [];
        let total = 0;

        function openMenu(name, items) {
            document.getElementById('modal-title').innerText = name;
            const list = document.getElementById('product-list');
            list.innerHTML = "";
            items.forEach(item => {
                list.innerHTML += `
                    <div class="product-item">
                        <div><b>${item[0]}</b><br><small>${item[1]} IQD</small></div>
                        <button class="add-btn" onclick="addToCart('${item[0]}', ${item[1]})">+</button>
                    </div>`;
            });
            document.getElementById('product-modal').style.display = 'block';
        }

        function closeMenu() { document.getElementById('product-modal').style.display = 'none'; }

        function addToCart(name, price) {
            cart.push(name);
            total += price;
            document.getElementById('total-price').innerText = total + " IQD";
            document.getElementById('cart-bar').style.display = 'flex';
        }

        function confirmOrder() {
            alert("Basha, siparişin yola çıkıyor!");
            // Buraya firebase push kodunu ekleyebiliriz
        }
    </script>
</body>
</html>
